<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit</title>
<style>
  :root {
    --bg: #ffffff;
    --side: #f3f3f2;
    --list: #fbfbfa;
    --text: #1d1d1f;
    --text-2: #6e6e73;
    --text-3: #a1a1a6;
    --hairline: rgba(0, 0, 0, 0.075);
    --fill: rgba(0, 0, 0, 0.045);
    --fill-2: rgba(0, 0, 0, 0.07);
    --accent: #56697a;
    --accent-soft: rgba(86, 105, 122, 0.11);
    --on-accent: #ffffff;
    --warn: #a8824a;
    --warn-soft: rgba(168, 130, 74, 0.13);
    --danger: #a3524a;
    --card: #ffffff;
    --card-border: rgba(0, 0, 0, 0.07);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1c1e; --side: #232325; --list: #1f1f21;
      --text: #f5f5f7; --text-2: #a1a1a6; --text-3: #6e6e73;
      --hairline: rgba(255,255,255,0.07); --fill: rgba(255,255,255,0.05); --fill-2: rgba(255,255,255,0.09);
      --accent: #7f94a6; --accent-soft: rgba(127,148,166,0.16); --on-accent: #ffffff;
      --warn: #d2b07c; --warn-soft: rgba(210,176,124,0.15); --danger: #d58a82;
      --card: #252527; --card-border: rgba(255,255,255,0.06);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1c1e; --side: #232325; --list: #1f1f21;
    --text: #f5f5f7; --text-2: #a1a1a6; --text-3: #6e6e73;
    --hairline: rgba(255,255,255,0.07); --fill: rgba(255,255,255,0.05); --fill-2: rgba(255,255,255,0.09);
    --accent: #7f94a6; --accent-soft: rgba(127,148,166,0.16); --on-accent: #ffffff;
    --warn: #d2b07c; --warn-soft: rgba(210,176,124,0.15); --danger: #d58a82;
    --card: #252527; --card-border: rgba(255,255,255,0.06);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased; letter-spacing: -0.008em;
    overflow: hidden;
  }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; padding: 0; }
  svg { display: block; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

  .app { display: grid; grid-template-columns: 236px 1fr; height: 100vh; }
  .content { display: grid; grid-template-rows: auto 1fr; min-width: 0; min-height: 0; height: 100vh; }
  .panes { display: grid; grid-template-columns: 340px 1fr; min-height: 0; }

  /* ---------- Stat cards ---------- */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; padding: 20px 24px; border-bottom: 1px solid var(--hairline); background: var(--bg); }
  .stat {
    position: relative; text-align: left; padding: 16px 18px 15px; border-radius: 14px;
    background: var(--card); border: 1px solid var(--card-border);
    box-shadow: 0 1px 2px rgba(0,0,0,0.03); transition: box-shadow .15s, border-color .15s, transform .15s;
  }
  .stat:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
  .stat[aria-pressed="true"] { border-color: var(--tone); box-shadow: 0 0 0 3px var(--tone-soft); }
  .stat-top { display: flex; align-items: center; justify-content: space-between; }
  .stat-label { font-size: 13px; font-weight: 500; color: var(--text-2); }
  .stat-ico { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--tone-soft); color: var(--tone); }
  .stat-ico svg { width: 15px; height: 15px; }
  .stat-num { font-size: 34px; font-weight: 600; letter-spacing: -0.035em; line-height: 1.1; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .stat-cap { font-size: 12px; color: var(--text-3); margin-top: 2px; }
  .tone-attention { --tone: #a8824a; --tone-soft: rgba(168,130,74,0.13); }
  .tone-cold { --tone: #5f7a93; --tone-soft: rgba(95,122,147,0.13); }
  .tone-followup { --tone: #6b8a74; --tone-soft: rgba(107,138,116,0.14); }

  /* ---------- Sidebar ---------- */
  .sidebar { background: var(--side); border-right: 1px solid var(--hairline); padding: 22px 12px; overflow-y: auto; }
  .brand { display: flex; align-items: center; gap: 9px; padding: 0 10px 22px; font-weight: 600; font-size: 15px; letter-spacing: -0.02em; }
  .brand-mark { width: 22px; height: 22px; color: var(--accent); }
  .side-label { font-size: 11px; font-weight: 600; color: var(--text-3); padding: 18px 10px 6px; letter-spacing: .02em; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 10px; border-radius: 7px;
    text-align: left; color: var(--text); transition: background .12s;
  }
  .nav-item:hover { background: var(--fill); }
  .nav-item[aria-current="true"] { background: var(--fill-2); font-weight: 500; }
  .nav-item .ico { width: 18px; height: 18px; color: var(--accent); flex: none; }
  .nav-item .dot { width: 9px; height: 9px; border-radius: 50%; margin: 0 4.5px; flex: none; }
  .nav-item .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-item .count { color: var(--text-3); font-size: 12px; font-variant-numeric: tabular-nums; }

  /* ---------- List ---------- */
  .listpane { background: var(--list); border-right: 1px solid var(--hairline); display: flex; flex-direction: column; min-width: 0; }
  .list-head { padding: 22px 18px 12px; }
  .list-title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .list-title { font-size: 22px; font-weight: 700; letter-spacing: -0.025em; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list-sub { color: var(--text-2); font-size: 12px; margin-top: 1px; }
  .icon-btn { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: var(--accent); flex: none; }
  .icon-btn:hover { background: var(--fill); }
  .icon-btn svg { width: 18px; height: 18px; }
  .search-wrap { position: relative; margin-top: 14px; }
  .search-wrap svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--text-3); }
  .search { width: 100%; padding: 7px 10px 7px 29px; border-radius: 8px; border: 0; background: var(--fill); outline: none; }
  .search:focus { box-shadow: 0 0 0 3px var(--accent-soft); }
  .search::placeholder { color: var(--text-3); }
  .sort-row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 12px; color: var(--text-2); }
  .sort { border: 0; background: none; color: var(--text-2); font-size: 12px; cursor: pointer; padding: 2px 0; text-align: right; }
  .chips { display: none; gap: 6px; overflow-x: auto; margin-top: 12px; padding-bottom: 2px; scrollbar-width: none; }
  .chip { padding: 5px 11px; border-radius: 999px; background: var(--fill); white-space: nowrap; font-size: 13px; }
  .chip[aria-current="true"] { background: var(--accent); color: var(--on-accent); }

  .list { flex: 1; overflow-y: auto; padding: 0 10px 16px; }
  .row {
    display: grid; grid-template-columns: 38px 1fr auto; gap: 12px; align-items: center;
    width: 100%; padding: 10px; border-radius: 10px; text-align: left; position: relative;
  }
  .row + .row::before { content: ""; position: absolute; top: 0; left: 60px; right: 10px; border-top: 1px solid var(--hairline); }
  .row:hover { background: var(--fill); }
  .row[aria-selected="true"] { background: var(--accent); color: var(--on-accent); }
  .row[aria-selected="true"]::before, .row[aria-selected="true"] + .row::before { border-color: transparent; }
  .row .meta { min-width: 0; }
  .row .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .snip { color: var(--text-2); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .when { font-size: 12px; color: var(--text-3); text-align: right; white-space: nowrap; align-self: start; padding-top: 2px; }
  .row .flag { display: block; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); margin: 6px 0 0 auto; }
  .row[aria-selected="true"] .snip, .row[aria-selected="true"] .when { color: rgba(255,255,255,0.78); }
  .row .flag.cold { background: #5f7a93; }
  .row .due { display: block; margin-top: 3px; font-size: 11px; font-weight: 600; color: #6b8a74; }
  .row[aria-selected="true"] .flag { background: #fff; }
  .row[aria-selected="true"] .due { color: #fff; }
  .list-empty { color: var(--text-3); text-align: center; padding: 48px 20px; }

  .avatar { border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 600; letter-spacing: 0; flex: none; }
  .avatar.sm { width: 38px; height: 38px; font-size: 13.5px; }
  .avatar.xl { width: 96px; height: 96px; font-size: 34px; margin: 0 auto; }

  /* ---------- Detail ---------- */
  .detail { overflow-y: auto; background: var(--bg); position: relative; }
  .detail-inner { max-width: 560px; margin: 0 auto; padding: 56px 32px 64px; }
  .back { display: none; align-items: center; gap: 2px; color: var(--accent); font-size: 15px; padding: 14px 16px 0; }
  .back svg { width: 18px; height: 18px; }
  .placeholder { height: 100%; display: grid; place-items: center; color: var(--text-3); text-align: center; }
  .placeholder svg { width: 44px; height: 44px; margin: 0 auto 12px; opacity: .6; }

  .hero { text-align: center; }
  .hero h2 { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; margin: 16px 0 4px; }
  .tag { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-2); }
  .tag .dot { width: 7px; height: 7px; border-radius: 50%; }
  .status { display: inline-block; margin-left: 8px; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); }

  .status.cold { background: rgba(95,122,147,0.13); color: #5f7a93; }
  .fu { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
  .fu .overdue { color: var(--danger); }
  .mini { padding: 3px 10px; border-radius: 999px; background: var(--fill); font-size: 12.5px; color: var(--text); transition: background .12s; }
  .mini:hover { background: var(--fill-2); }
  .actions { display: flex; justify-content: center; gap: 10px; margin: 24px 0 32px; }
  .action { display: flex; flex-direction: column; align-items: center; gap: 5px; width: 76px; padding: 10px 0 8px; border-radius: 12px; background: var(--fill); color: var(--accent); font-size: 11.5px; font-weight: 500; text-decoration: none; transition: background .12s; }
  .action:hover { background: var(--fill-2); }
  .action svg { width: 20px; height: 20px; }
  .action[aria-disabled="true"] { opacity: .4; pointer-events: none; }

  .group-label { font-size: 12px; font-weight: 600; color: var(--text-2); margin: 28px 4px 8px; }
  .card { background: var(--card); border: 1px solid var(--card-border); border-radius: 12px; }
  .info-row { display: grid; grid-template-columns: 96px 1fr; gap: 12px; padding: 11px 16px; }
  .info-row + .info-row { border-top: 1px solid var(--hairline); }
  .info-row dt { color: var(--text-2); }
  .info-row dd { margin: 0; overflow-wrap: anywhere; }
  .info-row a { color: var(--accent); text-decoration: none; }
  .info-row a:hover { text-decoration: underline; }

  .composer { padding: 12px 14px; }
  .composer textarea { width: 100%; border: 0; background: none; resize: none; min-height: 52px; outline: none; padding: 2px; }
  .composer textarea::placeholder { color: var(--text-3); }
  .composer-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; border-top: 1px solid var(--hairline); padding-top: 10px; margin-top: 6px; }
  .date-input { border: 0; background: var(--fill); border-radius: 6px; padding: 4px 8px; font-size: 12.5px; color: var(--text-2); }

  .btn { padding: 6px 14px; border-radius: 7px; font-weight: 500; font-size: 13px; background: var(--accent); color: var(--on-accent); transition: opacity .12s; }
  .btn:hover { opacity: .88; }
  .btn:disabled { opacity: .35; cursor: default; }
  .btn.plain { background: var(--fill); color: var(--text); }
  .btn.link { background: none; color: var(--accent); padding-left: 0; padding-right: 0; }
  .btn.danger { background: none; color: var(--danger); padding-left: 0; padding-right: 0; }

  .timeline { list-style: none; margin: 0; padding: 4px 16px; }
  .timeline li { display: grid; grid-template-columns: 14px 1fr; gap: 12px; padding: 12px 0; position: relative; }
  .timeline li + li { border-top: 1px solid var(--hairline); }
  .timeline .pip { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-top: 6px; opacity: .55; }
  .timeline li:first-child .pip { opacity: 1; }
  .timeline .d { font-size: 12px; color: var(--text-3); }

  .foot { display: flex; justify-content: space-between; margin-top: 32px; }

  /* Edit form */
  .form-title { font-size: 22px; font-weight: 700; letter-spacing: -0.025em; margin: 0 0 20px; }
  .field { display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: center; padding: 8px 16px; }
  .field + .field { border-top: 1px solid var(--hairline); }
  .field label { color: var(--text-2); }
  .field input, .field textarea { border: 0; background: none; outline: none; padding: 4px 0; width: 100%; }
  .field textarea { resize: vertical; min-height: 56px; }
  .field input::placeholder, .field textarea::placeholder { color: var(--text-3); }
  .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }

  .note-foot { text-align: center; font-size: 11.5px; color: var(--text-3); margin-top: 40px; }
  .note-foot button { color: var(--text-3); text-decoration: underline; font-size: 11.5px; }

  /* ---------- Responsive ---------- */
  @media (max-width: 1080px) {
    .app { grid-template-columns: 200px 1fr; }
    .panes { grid-template-columns: 300px 1fr; }
    .stats { padding: 16px; gap: 10px; }
    .stat { padding: 14px; }
  }
  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .panes { grid-template-columns: 1fr; }
    .listpane { border-right: 0; min-height: 0; }
    .stats { gap: 8px; padding: 16px 16px 4px; border-bottom: 0; background: var(--list); }
    .stat { padding: 11px 12px; border-radius: 12px; }
    .stat-ico { display: none; }
    .stat-label { font-size: 11.5px; line-height: 1.25; }
    .stat-num { font-size: 26px; margin-top: 2px; }
    .stat-cap { display: none; }
    .chips { display: flex; }
    .detail { position: fixed; inset: 0; transform: translateX(100%); transition: transform .28s cubic-bezier(.3,.7,.2,1); z-index: 5; }
    .app.show-detail .detail { transform: none; }
    .back { display: inline-flex; }
    .detail-inner { padding: 20px 16px 48px; }
    .info-row, .field { grid-template-columns: 80px 1fr; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="Categories"></aside>

  <div class="content">
  <div class="stats" id="stats" aria-label="Overview"></div>

  <div class="panes">
  <section class="listpane" aria-label="People">
    <div class="list-head">
      <div class="list-title-row">
        <div style="min-width:0">
          <h1 class="list-title" id="listTitle">All People</h1>
          <div class="list-sub" id="listSub"></div>
        </div>
        <button class="icon-btn" id="addBtn" title="Add person" aria-label="Add person">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M10 4v12M4 10h12"/></svg>
        </button>
      </div>
      <div class="chips" id="chips"></div>
      <div class="search-wrap">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="4.8"/><path d="M10.6 10.6 14 14"/></svg>
        <input class="search" id="search" type="search" placeholder="Search" aria-label="Search people">
      </div>
      <div class="sort-row">
        <span id="sortHint"></span>
        <select class="sort" id="sort" aria-label="Sort by">
          <option value="recent">Sort by Most Recent</option>
          <option value="oldest">Sort by Longest Ago</option>
          <option value="name">Sort by Name</option>
        </select>
      </div>
    </div>
    <div class="list" id="list" role="listbox" aria-label="People" tabindex="0"></div>
  </section>

  <main class="detail" id="detail" aria-label="Profile"></main>
  </div>
  </div>
</div>

  edit: `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 6h12M4 10h12M4 14h7"/></svg>`,
  back: `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4 6.5 10l6 6"/></svg>`,
  person: `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2"><circle cx="24" cy="24" r="21"/><circle cx="24" cy="19" r="7"/><path d="M11 37.5c2.6-5 7.3-7.5 13-7.5s10.4 2.5 13 7.5"/></svg>`,
};

// ---------- State ----------
let people = load();
let view = "all";          // "all" | "recent" | "attention" | "cold" | "followup" | "cat:<name>"
let selectedId = null;
let editing = null;        // null | "new" | person id
let query = "";
let sortMode = "recent";

function uid() { return Math.random().toString(36).slice(2, 10); }
function load() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY));
    if (Array.isArray(saved)) return saved;
  } catch (e) {}
  return SAMPLE.map(p => ({ id: uid(), ...p, history: p.history.map(h => ({ ...h })) }));
}
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(people)); } catch (e) {} }

// ---------- Helpers ----------
const $ = s => document.querySelector(s);
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function parseDate(iso) { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d); }
function todayISO() { const t = new Date(); return new Date(t.getTime() - t.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
function fmtDate(iso, short) { return parseDate(iso).toLocaleDateString("en-US", short ? { month: "short", day: "numeric" } : { month: "long", day: "numeric", year: "numeric" }); }
function daysSince(iso) { const t = new Date(); t.setHours(0, 0, 0, 0); return Math.round((t - parseDate(iso)) / 86400000); }
function relative(iso) {
  const d = daysSince(iso);
  if (d <= 0) return "Today";
  if (d === 1) return "Yesterday";
  if (d < 7) return `${d} days ago`;
  if (d < 30) { const w = Math.floor(d / 7); return w === 1 ? "1 week ago" : `${w} weeks ago`; }
  if (d < 365) { const m = Math.floor(d / 30); return m === 1 ? "1 month ago" : `${m} months ago`; }
  const y = Math.floor(d / 365); return y === 1 ? "1 year ago" : `${y} years ago`;
}
function shortWhen(iso) {
  const d = daysSince(iso);
  if (d <= 0) return "Today";
  if (d === 1) return "Yesterday";
  if (d < 7) return parseDate(iso).toLocaleDateString("en-US", { weekday: "long" });
  return fmtDate(iso, true);
}
function latest(p) { return [...p.history].sort((a, b) => b.date.localeCompare(a.date))[0] || null; }
function lastDate(p) { return latest(p)?.date || "0000-00-00"; }
function idleDays(p) { const l = latest(p); return l ? daysSince(l.date) : Infinity; }
function isCold(p) { return idleDays(p) >= COLD_DAYS; }
function needsAttention(p) { const d = idleDays(p); return d >= ATTENTION_DAYS && d < COLD_DAYS; }
function followUpDue(p) { return !!p.followUp && -daysSince(p.followUp) <= FOLLOW_UP_WINDOW; }
function followUpLabel(iso) {
  const d = -daysSince(iso);
  if (d < 0) return d === -1 ? "Overdue by 1 day" : `Overdue by ${-d} days`;
  if (d === 0) return "Today";
  if (d === 1) return "Tomorrow";
  if (d < 7) return parseDate(iso).toLocaleDateString("en-US", { weekday: "long" });
  return fmtDate(iso, true);
}
function addDays(n) { const t = new Date(); t.setDate(t.getDate() + n); return new Date(t.getTime() - t.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
function isRecent(p) { const l = latest(p); return !!l && daysSince(l.date) <= RECENT_DAYS; }
function hash(s) { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; }
function colorFor(s) { return PALETTE[hash(s || "") % PALETTE.length]; }
function initials(name) { return name.trim().split(/\s+/).slice(0, 2).map(w => w[0]?.toUpperCase() || "").join(""); }
function avatar(p, size) { return `<div class="avatar ${size}" style="background:${colorFor(p.name)}" aria-hidden="true">${esc(initials(p.name))}</div>`; }
function categories() { return [...new Set(people.map(p => p.industry).filter(Boolean))].sort((a, b) => a.localeCompare(b)); }
function isMobile() { return matchMedia("(max-width: 820px)").matches; }

function viewInfo(v) {
  if (v === "all") return { title: "All People", test: () => true };
  if (v === "recent") return { title: "Recently in Touch", test: isRecent };
  if (v === "attention") return { title: "Need Attention", test: needsAttention };
  if (v === "cold") return { title: "Gone Cold", test: isCold };
  if (v === "followup") return { title: "Follow Up This Week", test: followUpDue };
  const cat = v.slice(4);
  return { title: cat, test: p => p.industry === cat };
}

function visiblePeople() {
  const q = query.trim().toLowerCase();
  const rows = people
    .filter(viewInfo(view).test)
    .filter(p => !q || [p.name, p.industry, p.email, p.phone, ...p.history.map(h => h.text)].join(" ").toLowerCase().includes(q));
  if (view === "followup") return rows.sort((a, b) => a.followUp.localeCompare(b.followUp));
  if (sortMode === "name") rows.sort((a, b) => a.name.localeCompare(b.name));
  if (sortMode === "recent") rows.sort((a, b) => lastDate(b).localeCompare(lastDate(a)));
  if (sortMode === "oldest") rows.sort((a, b) => lastDate(a).localeCompare(lastDate(b)));
  return rows;
}

// ---------- Rendering ----------
function renderSidebar() {
  const count = v => people.filter(viewInfo(v).test).length;
  const item = (v, icon, label) => `
    <button class="nav-item" data-view="${esc(v)}" aria-current="${view === v}">
      ${icon}<span class="label">${esc(label)}</span><span class="count">${count(v) || ""}</span>
    </button>`;
  $("#sidebar").innerHTML = `
    <div class="brand"><span class="brand-mark">${ICONS.logo}</span>Orbit</div>
    ${item("all", `<span class="ico">${ICONS.all}</span>`, "All People")}
    ${item("recent", `<span class="ico">${ICONS.recent}</span>`, "Recently in Touch")}
    <div class="side-label">Status</div>
    ${item("attention", `<span class="ico">${ICONS.attention}</span>`, "Need Attention")}
    ${item("cold", `<span class="ico">${ICONS.cold}</span>`, "Gone Cold")}
    ${item("followup", `<span class="ico">${ICONS.followup}</span>`, "Follow Up This Week")}
    <div class="side-label">Categories</div>
    ${categories().map(c => item("cat:" + c, `<span class="dot" style="background:${colorFor(c)}"></span>`, c)).join("")}
  `;

  $("#chips").innerHTML = [["all", "All"], ["recent", "Recent"], ...categories().map(c => ["cat:" + c, c])]
    .map(([v, l]) => `<button class="chip" data-view="${esc(v)}" aria-current="${view === v}">${esc(l)}</button>`).join("");
}

function renderStats() {
  const card = (v, tone, label, caption) => {
    const n = people.filter(viewInfo(v).test).length;
    return `<button class="stat tone-${tone}" data-view="${v}" aria-pressed="${view === v}">
      <div class="stat-top"><span class="stat-label">${label}</span><span class="stat-ico">${ICONS[tone]}</span></div>
      <div class="stat-num">${n}</div>
      <div class="stat-cap">${caption}</div>
    </button>`;
  };
  $("#stats").innerHTML =
    card("attention", "attention", "Need Attention", `No contact in ${ATTENTION_DAYS}–${COLD_DAYS - 1} days`) +
    card("cold", "cold", "Gone Cold", `No contact in ${COLD_DAYS}+ days`) +
    card("followup", "followup", "Follow Up This Week", "Due in the next 7 days or overdue");
}

function renderList() {
  const rows = visiblePeople();
  $("#listTitle").textContent = viewInfo(view).title;
  $("#listSub").textContent = `${rows.length} ${rows.length === 1 ? "person" : "people"}`;
  const list = $("#list");
  if (!rows.length) {
    list.innerHTML = `<div class="list-empty">${query ? "No results"
      : view === "attention" ? "No one is drifting. Nice work."
      : view === "cold" ? "No one has gone cold."
      : view === "followup" ? "No follow-ups due this week.<br>Set one from anyone's profile."
      : "No one here yet"}</div>`;
    return;
  }
  list.innerHTML = rows.map(p => {
    const l = latest(p);
    return `<button class="row" role="option" data-id="${p.id}" aria-selected="${p.id === selectedId}">
      ${avatar(p, "sm")}
      <div class="meta">
        <div class="nm">${esc(p.name)}</div>
        <div class="snip">${esc(l?.text || p.industry || "No notes yet")}</div>
      </div>
      <div class="when">${l ? shortWhen(l.date) : "—"}${
        followUpDue(p) ? `<span class="due">${esc(followUpLabel(p.followUp))}</span>`
        : isCold(p) ? `<span class="flag cold" title="Gone cold"></span>`
        : needsAttention(p) ? `<span class="flag" title="Needs attention"></span>` : ""}</div>
    </button>`;
  }).join("");
}

function renderDetail() {
  const el = $("#detail");
  const back = `<button class="back" data-back>${ICONS.back}People</button>`;

  if (editing) { el.innerHTML = back + renderForm(); bindForm(); return; }

  const p = people.find(x => x.id === selectedId);
  if (!p) {
    el.innerHTML = `<div class="placeholder"><div>${ICONS.person}<div>${people.length ? "Select a person" : "Add someone to get started"}</div></div></div>`;
    return;
  }
  const l = latest(p);
  const hist = [...p.history].sort((a, b) => b.date.localeCompare(a.date));
  el.innerHTML = `${back}
    <div class="detail-inner">
      <div class="hero">
        ${avatar(p, "xl")}
        <h2>${esc(p.name)}</h2>
        <div>
          ${p.industry ? `<span class="tag"><span class="dot" style="background:${colorFor(p.industry)}"></span>${esc(p.industry)}</span>` : ""}
          ${isCold(p) ? `<span class="status cold">Gone cold</span>` : needsAttention(p) ? `<span class="status">Needs attention</span>` : ""}
        </div>
      </div>

      <div class="actions">
        <a class="action" href="mailto:${esc(p.email)}" aria-disabled="${!p.email}">${ICONS.mail}Email</a>
        <a class="action" href="tel:${esc(p.phone)}" aria-disabled="${!p.phone}">${ICONS.phone}Call</a>
        <button class="action" data-focus-log>${ICONS.note}Log</button>
      </div>

      <dl class="card" style="margin:0">
        <div class="info-row"><dt>Last spoke</dt><dd>${l ? `${fmtDate(l.date)} <span style="color:var(--text-3)">· ${relative(l.date).toLowerCase()}</span>` : "Never"}</dd></div>
        <div class="info-row"><dt>Email</dt><dd>${p.email ? `<a href="mailto:${esc(p.email)}">${esc(p.email)}</a>` : `<span style="color:var(--text-3)">—</span>`}</dd></div>
        <div class="info-row"><dt>Phone</dt><dd>${p.phone ? `<a href="tel:${esc(p.phone)}">${esc(p.phone)}</a>` : `<span style="color:var(--text-3)">—</span>`}</dd></div>
        <div class="info-row"><dt>Follow up</dt><dd class="fu">${p.followUp
          ? `<span class="${daysSince(p.followUp) > 0 ? "overdue" : ""}">${esc(followUpLabel(p.followUp))}${-daysSince(p.followUp) >= 2 && -daysSince(p.followUp) < 7 ? ` · ${fmtDate(p.followUp, true)}` : ""}</span>
             <button class="btn link" data-fu-clear>Clear</button>`
          : `<button class="mini" data-fu="1">Tomorrow</button>
             <button class="mini" data-fu="7">Next week</button>
             <button class="mini" data-fu="30">In a month</button>
             <input class="date-input" type="date" data-fu-pick min="${todayISO()}" aria-label="Pick a follow-up date">`}</dd></div>
      </dl>

      <div class="group-label">Log a Conversation</div>
      <form class="card composer" id="logForm">
        <textarea id="logText" placeholder="What did you talk about?" aria-label="What did you talk about?"></textarea>
        <div class="composer-foot">
          <input class="date-input" type="date" id="logDate" value="${todayISO()}" max="${todayISO()}" aria-label="Date" required>
          <button class="btn" type="submit" id="logSave" disabled>Save</button>
        </div>
      </form>

      <div class="group-label">Notes</div>
      <div class="card">
        ${hist.length ? `<ul class="timeline">${hist.map(h => `<li><span class="pip"></span><div><div class="d">${fmtDate(h.date)}</div>${esc(h.text)}</div></li>`).join("")}</ul>`
          : `<div style="padding:16px;color:var(--text-3)">No conversations logged yet.</div>`}
      </div>

      <div class="foot">
        <button class="btn danger" id="delBtn">Remove Person</button>
        <button class="btn plain" id="editBtn">Edit Details</button>
      </div>
      <div class="note-foot">Saved on this computer only · <button id="resetBtn">Reset to sample data</button></div>
    </div>`;

  const txt = $("#logText"), saveBtn = $("#logSave");
  txt.oninput = () => { saveBtn.disabled = !txt.value.trim(); };
  $("#logForm").onsubmit = e => {
    e.preventDefault();
    const text = txt.value.trim(), date = $("#logDate").value;
    if (!text || !date) return;
    p.history.push({ date, text });
    delete p.followUp; // you've been in touch, so the follow-up is done
    save(); renderAll();
  };
  const setFollowUp = iso => { if (iso) p.followUp = iso; else delete p.followUp; save(); renderAll(); };
  el.querySelectorAll("[data-fu]").forEach(b => b.onclick = () => setFollowUp(addDays(+b.dataset.fu)));
  el.querySelector("[data-fu-pick]")?.addEventListener("change", e => setFollowUp(e.target.value));
  el.querySelector("[data-fu-clear]")?.addEventListener("click", () => setFollowUp(null));
  el.querySelector("[data-focus-log]").onclick = () => { txt.focus(); txt.scrollIntoView({ behavior: "smooth", block: "center" }); };
  $("#editBtn").onclick = () => { editing = p.id; renderDetail(); };
  $("#delBtn").onclick = () => {
    if (!confirm(`Remove ${p.name} from Orbit?`)) return;
    people = people.filter(x => x.id !== p.id);
    selectedId = null; save(); closeDetailMobile(); renderAll();
  };
  $("#resetBtn").onclick = () => {
    if (!confirm("Replace everything with the original sample data?")) return;
    try { localStorage.removeItem(STORE_KEY); } catch (e) {}
    people = load(); view = "all"; selectedId = null; selectFirst(); renderAll();
  };
}

function renderForm() {
  const isNew = editing === "new";
  const p = isNew ? {} : people.find(x => x.id === editing);
  return `<div class="detail-inner">
    <form id="personForm">
      <h2 class="form-title">${isNew ? "New Person" : "Edit Details"}</h2>
      <div class="card">
        <div class="field"><label for="fName">Name</label><input id="fName" required placeholder="Full name" value="${esc(p.name)}"></div>
        <div class="field"><label for="fIndustry">Category</label><input id="fIndustry" list="catList" placeholder="e.g. Finance" value="${esc(p.industry)}"></div>
        <div class="field"><label for="fEmail">Email</label><input id="fEmail" type="email" placeholder="name@example.com" value="${esc(p.email)}"></div>
        <div class="field"><label for="fPhone">Phone</label><input id="fPhone" type="tel" placeholder="(555) 000-0000" value="${esc(p.phone)}"></div>
      </div>
      <datalist id="catList">${categories().map(c => `<option value="${esc(c)}">`).join("")}</datalist>
      ${isNew ? `
        <div class="group-label">Last Conversation</div>
        <div class="card">
          <div class="field"><label for="fDate">Date</label><input id="fDate" type="date" value="${todayISO()}" max="${todayISO()}"></div>
          <div class="field"><label for="fNote">Notes</label><textarea id="fNote" placeholder="What did you talk about?"></textarea></div>
        </div>` : ""}
      <div class="form-actions">
        <button class="btn plain" type="button" id="cancelBtn">Cancel</button>
        <button class="btn" type="submit">Done</button>
      </div>
    </form>
  </div>`;
}

function bindForm() {
  const isNew = editing === "new";
  $("#fName").focus();
  $("#cancelBtn").onclick = () => {
    editing = null;
    if (isNew && isMobile() && !selectedId) closeDetailMobile();
    renderDetail();
  };
  $("#personForm").onsubmit = e => {
    e.preventDefault();
    const v = s => $(s).value.trim();
    const data = { name: v("#fName"), industry: v("#fIndustry"), email: v("#fEmail"), phone: v("#fPhone") };
    if (!data.name) return;
    if (isNew) {
      const date = v("#fDate"), note = v("#fNote");
      const person = { id: uid(), ...data, history: date ? [{ date, text: note || "Caught up." }] : [] };
      people.push(person);
      selectedId = person.id;
      if (view.startsWith("cat:") && view.slice(4) !== data.industry) view = "all";
    } else {
      Object.assign(people.find(x => x.id === editing), data);
    }
    editing = null; save(); renderAll();
  };
}

function renderAll() {
  if (view.startsWith("cat:") && !categories().includes(view.slice(4))) view = "all";
  renderSidebar(); renderStats(); renderList(); renderDetail();
}

function select(id) {
  selectedId = id; editing = null;
  renderList(); renderDetail();
  $("#detail").scrollTop = 0;
  if (isMobile()) $("#app").classList.add("show-detail");
}
function closeDetailMobile() { $("#app").classList.remove("show-detail"); }
function selectFirst() { if (!isMobile()) selectedId = visiblePeople()[0]?.id || null; }

// ---------- Events ----------
document.addEventListener("click", e => {
  const nav = e.target.closest("[data-view]");
  if (nav) {
    // Clicking an already-selected card goes back to everyone
    view = nav.classList.contains("stat") && view === nav.dataset.view ? "all" : nav.dataset.view;
    renderSidebar(); renderStats(); renderList(); return;
  }
  const row = e.target.closest(".row");
  if (row) { select(row.dataset.id); return; }
  if (e.target.closest("[data-back]")) { editing = null; closeDetailMobile(); renderList(); }
});
$("#addBtn").onclick = () => {
  editing = "new"; renderDetail();
  if (isMobile()) $("#app").classList.add("show-detail");
};
$("#search").oninput = e => { query = e.target.value; renderList(); };
$("#sort").onchange = e => { sortMode = e.target.value; renderList(); };
$("#list").addEventListener("keydown", e => {
  if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
  e.preventDefault();
  const rows = visiblePeople();
  if (!rows.length) return;
  const i = rows.findIndex(p => p.id === selectedId);
  const next = e.key === "ArrowDown" ? Math.min(rows.length - 1, i + 1) : Math.max(0, i - 1);
  select(rows[next].id);
  $(`.row[data-id="${rows[next].id}"]`)?.focus();
});

selectFirst();
renderAll();
</script>
</body>
</html>
